name: Mutation gate

# Every mutant replays the whole suite, so this runs weekly and on demand rather than per push.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mutate
