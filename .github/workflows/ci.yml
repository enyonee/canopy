name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: tests, coverage, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run coverage
      - run: npm run types

  verify:
    name: acceptance checks (all apps)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node verify/run.mjs
