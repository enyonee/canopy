name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: tests, coverage, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run coverage
      - run: npm run types

  verify:
    name: acceptance checks (all apps)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node verify/run.mjs
      # Clock moved ten years ahead: a seed or check with a literal date fails here, not in someone's morning.
      - run: SHIFT_DAYS=3650 NODE_OPTIONS="--import ./verify/shift.mjs" node verify/run.mjs --dated
